mme 3</text><text x="135" y="313.8" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="12" font-weight="600" fill="#1F2937">manual reports</text><rect x="348" y="150" width="200" height="116" rx="14" fill="#FFF7EC" stroke="#D97706" stroke-width="1.5" filter="url(#ds)"/><rect x="348" y="150" width="4.5" height="116" rx="2" fill="#D97706"/><text x="448" y="190.4" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="700" fill="#8A4B08">Automated tracker</text><text x="448" y="212.4" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="700" fill="#8A4B08">Google Sheets +</text><text x="448" y="234.4" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="700" fill="#8A4B08">Apps Script</text><path d="M548 208 L664 208" fill="none" stroke="#3D6491" stroke-width="2" marker-end="url(#arw)"/><path class="dash" d="M548 208 L664 208" fill="none" stroke="#3D6491" stroke-width="2.2" stroke-linecap="round" opacity="0.9"/><rect x="664" y="160" width="204" height="96" rx="14" fill="#EEF3FB" stroke="#3D6491" stroke-width="1.5" filter="url(#ds)"/><text x="766" y="194.3" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#1B3A6B">Insights &amp; reporting</text><text x="766" y="212.3" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#1B3A6B">weekly delivery reviews</text><text x="766" y="230.3" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#1B3A6B">engagement segmentation</text><rect x="348" y="300" width="200" height="44" rx="22" fill="#1B3A6B" stroke="#D9DEE6" stroke-width="1.5" filter="url(#ds)"/><text x="448" y="326.3" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="12.5" font-weight="700" fill="#FAFAF8">50%+ less manual tracking</text>
