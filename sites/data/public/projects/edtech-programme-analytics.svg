  <rect x="1" y="1" width="898" height="418" rx="17" fill="none" stroke="#D9DEE6"/>
  <rect x="1" y="1" width="898" height="52" rx="17" fill="#1B3A6B"/>
  <rect x="1" y="30" width="898" height="23" fill="#1B3A6B"/>
  <circle class="pulse" cx="30" cy="27" r="5" fill="#F59E0B"/>
  <text x="48" y="32" font-family="Inter,sans-serif" font-size="14" font-weight="700" fill="#FAFAF8">Automated reporting system</text>
  <text x="878" y="32" text-anchor="end" font-family="Inter,sans-serif" font-size="10.5" font-weight="700" letter-spacing="2" fill="#F59E0B">DATA FLOW</text>
